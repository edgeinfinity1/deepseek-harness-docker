<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 管理台</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2e; --panel2:#0f172a; --line:#233150;
    --txt:#e6edf7; --mut:#8aa0bf; --acc:#3b82f6; --acc2:#2563eb;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --dim:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  .wrap{max-width:880px;margin:0 auto}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
  .head-txt h1{font-size:20px;margin-bottom:4px}
  .head-txt .sub{color:var(--mut);font-size:13px}
  #btnLang{
    flex-shrink:0;background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  #btnLang:hover{border-color:var(--acc);color:var(--acc)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--dim);color:#fff}
  .badge.ok{background:var(--ok)} .badge.warn{background:var(--warn)} .badge.err{background:var(--err)} .badge.act{background:var(--acc)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  label{color:var(--mut);font-size:13px}
  input[type=text],select{
    flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:8px 10px;font-size:13px;outline:none;
  }
  input[type=text]:focus,select:focus{border-color:var(--acc)}
  button{
    background:var(--acc);border:none;color:#fff;border-radius:8px;padding:8px 16px;
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  button:hover{background:var(--acc2)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
  button.ghost:hover{color:var(--txt);border-color:var(--mut)}
  button.danger{background:#7f1d1d} button.danger:hover{background:#991b1b}
  .hint{font-size:12px;color:var(--mut);margin-top:6px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
  .kv dt{color:var(--mut)} .kv dd{color:var(--txt);word-break:break-all}
  pre.log{
    background:#05070d;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font:12px/1.55 ui-monospace,Consolas,monospace;color:#b8c7e0;height:240px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  }
  pre.log .err{color:var(--err)}
  a.back{color:var(--acc);text-decoration:none;font-size:13px}
  a.back:hover{text-decoration:underline}
  .mt{margin-top:10px}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="head-txt">
      <h1 data-i18n="title">DeepSeek Harness 管理台</h1>
      <div class="sub" data-i18n="sub">管理员变体镜像 · 在此选择/切换 DSH 版本、配置 npm 源并管理 DSH 进程</div>
    </div>
    <button id="btnLang" type="button">EN</button>
  </div>

  <div class="card">
    <h2><span data-i18n="stTitle">运行状态</span> <span id="stBadge" class="badge warn" data-i18n="stChecking">检测中</span></h2>
    <dl class="kv">
      <dt data-i18n="stLabelCur">当前版本</dt><dd><span id="stActual">-</span> <span id="stRequested" class="tag"></span></dd>
      <dt data-i18n="stLabelTime">安装时间</dt><dd id="stInstalledAt">-</dd>
      <dt data-i18n="stLabelRun">运行状态</dt><dd id="stRunning">-</dd>
      <dt data-i18n="stLabelUi">DSH 界面</dt><dd><a class="back" href="/" id="linkDash" data-i18n="stOpenUi">打开 DSH 界面 ↗</a></dd>
    </dl>
    <div class="row mt">
      <button id="btnRestart" class="ghost" data-i18n="btnRestart">重启 DSH</button>
      <button id="btnRefresh" class="ghost" data-i18n="btnRefresh">刷新状态</button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="regTitle">npm 源（NPM_CONFIG_REGISTRY）</h2>
    <div class="row">
      <input type="text" id="regInput" placeholder="加载中..." spellcheck="false" autocomplete="off" data-i18n-ph="regPlaceholder">
      <button id="btnRegUseDef" data-i18n="btnRegUseDef">使用默认值</button>
      <button id="btnRegSave" data-i18n="btnRegSave">保存</button>
    </div>
    <div class="hint" id="regHint" data-i18n="regHintLoading">加载中...</div>
  </div>

  <div class="card">
    <h2 data-i18n="verTitle">DSH 版本</h2>
    <div class="row">
      <select id="verSelect"><option data-i18n="verLoading">加载版本列表中...</option></select>
      <button id="btnInstall" data-i18n="btnInstall">安装 / 切换版本</button>
      <button id="btnRefreshVer" class="ghost" data-i18n="btnRefreshVer">刷新列表</button>
    </div>
    <div class="hint" data-i18n="verHint">安装或切换后会自动启动 DSH。</div>
  </div>

  <div class="card">
    <h2><span data-i18n="logTitle">安装日志（实时）</span> <button id="btnClearLog" class="ghost" style="margin-left:auto" data-i18n="btnClearLog">清空</button></h2>
    <pre class="log" id="log"></pre>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  // ── 中英文翻译 ─────────────────────────────────────────────
  var LANGS = {
    zh: {
      title: 'DeepSeek Harness 管理台',
      sub: '管理员变体镜像 · 在此选择/切换 DSH 版本、配置 npm 源并管理 DSH 进程',
      stTitle: '运行状态', stChecking: '检测中',
      stLabelCur: '当前版本', stLabelTime: '安装时间', stLabelRun: '运行状态', stLabelUi: 'DSH 界面', stOpenUi: '打开 DSH 界面 ↗',
      btnRestart: '重启 DSH', btnRefresh: '刷新状态',
      regTitle: 'npm 源（NPM_CONFIG_REGISTRY）', regPlaceholder: '加载中...', btnRegUseDef: '使用默认值', btnRegSave: '保存',
      regHintLoading: '加载中...',
      verTitle: 'DSH 版本', verLoading: '加载版本列表中...', btnInstall: '安装 / 切换版本', btnRefreshVer: '刷新列表', verHint: '安装或切换后会自动启动 DSH。',
      logTitle: '安装日志（实时）', btnClearLog: '清空',
      badgeInstalling: '安装中', badgeRunning: '运行中', badgeNotRun: '未运行', badgeNotInstalled: '未安装',
      stSelectedPrefix: '已选 ', runYes: '运行中', runNo: '已停止',
      allVersions: '全部版本', noVersions: '（无可用版本）',
      errTag: '[错误]', warnTag: '[警告]',
      logConnecting: '连接管理服务...',
      regHintDefault: '默认值：', regHintLast: ' ｜ 上次配置：', regHintEff: ' ｜ 当前生效：',
      regHintPriority: '优先级：页面配置 > 环境变量 NPM_CONFIG_REGISTRY > 默认值。',
      regHintNote: '保存后仅对后续安装/版本列表生效，不会改动已安装的 DSH。',
      regSaved: '已保存 npm 源：{v}', useDefaultLabel: '（使用默认值）', errSave: '[错误] 保存失败: {e}',
      warnVersions: '[警告] 获取版本列表失败: {e}',
      logRefreshStart: '刷新版本列表...', logRefreshDone: '版本列表已刷新（{n} 个版本）',
      warnSelectFirst: '[警告] 请先选择版本', logInstallSubmit: '已提交安装任务：{v}（实时日志见下方）',
      errRefresh: '[错误] 刷新状态失败: {e}',
      restartDone: 'DSH 已重启', restartFail: '重启失败: {r}',
      sseStart: '开始安装 DSH {v} ...', sseDone: '安装完成，当前版本：{v}', sseDoneFail: '安装失败',
      sseBootOk: 'DSH 已启动', sseBootFail: 'DSH 启动失败: {r}'
    },
    en: {
      title: 'DeepSeek Harness Admin',
      sub: 'Admin variant image · Select/switch DSH version, configure npm registry and manage DSH process',
      stTitle: 'Runtime Status', stChecking: 'Checking',
      stLabelCur: 'Current version', stLabelTime: 'Installed at', stLabelRun: 'Status', stLabelUi: 'DSH UI', stOpenUi: 'Open DSH UI ↗',
      btnRestart: 'Restart DSH', btnRefresh: 'Refresh',
      regTitle: 'npm registry (NPM_CONFIG_REGISTRY)', regPlaceholder: 'Loading...', btnRegUseDef: 'Use default', btnRegSave: 'Save',
      regHintLoading: 'Loading...',
      verTitle: 'DSH Version', verLoading: 'Loading versions...', btnInstall: 'Install / Switch', btnRefreshVer: 'Refresh list', verHint: 'DSH will start automatically after install or switch.',
      logTitle: 'Install log (live)', btnClearLog: 'Clear',
      badgeInstalling: 'Installing', badgeRunning: 'Running', badgeNotRun: 'Not running', badgeNotInstalled: 'Not installed',
      stSelectedPrefix: 'Selected ', runYes: 'Running', runNo: 'Stopped',
      allVersions: 'All versions', noVersions: '(no available versions)',
      errTag: '[Error]', warnTag: '[Warning]',
      logConnecting: 'Connecting to management service...',
      regHintDefault: 'Default: ', regHintLast: ' ｜ Last saved: ', regHintEff: ' ｜ Effective: ',
      regHintPriority: 'Priority: page config > env var NPM_CONFIG_REGISTRY > default.',
      regHintNote: 'Saving only affects future installs/version list; installed DSH is not modified.',
      regSaved: 'npm registry saved: {v}', useDefaultLabel: '(using default)', errSave: '[Error] Save failed: {e}',
      warnVersions: '[Warning] Failed to load version list: {e}',
      logRefreshStart: 'Refreshing version list...', logRefreshDone: 'Version list refreshed ({n} versions)',
      warnSelectFirst: '[Warning] Please select a version first', logInstallSubmit: 'Install task submitted: {v} (see live log below)',
      errRefresh: '[Error] Failed to refresh status: {e}',
      restartDone: 'DSH restarted', restartFail: 'Restart failed: {r}',
      sseStart: 'Start installing DSH {v} ...', sseDone: 'Install complete, current version: {v}', sseDoneFail: 'Install failed',
      sseBootOk: 'DSH started', sseBootFail: 'DSH failed to start: {r}'
    }
  };

  var T = LANGS.zh;
  var lang = 'zh';
  var lastState = null;

  function t(key, params){
    var s = (T && T[key] != null) ? T[key] : (LANGS.zh[key] != null ? LANGS.zh[key] : key);
    if (params) {
      Object.keys(params).forEach(function(k){
        s = s.split('{' + k + '}').join(params[k]);
      });
    }
    return s;
  }

  function applyLang(l){
    lang = (l === 'en') ? 'en' : 'zh';
    T = LANGS[lang];
    try { localStorage.setItem('dshLang', lang); } catch(e){}
    document.documentElement.lang = lang;
    document.title = t('title');
    $('btnLang').textContent = lang === 'zh' ? 'EN' : '中文';
    $('btnLang').title = lang === 'zh' ? 'Switch to English' : '切换到中文';
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute('data-i18n'));
    var phs = document.querySelectorAll('[data-i18n-ph]');
    for (var j = 0; j < phs.length; j++) phs[j].placeholder = t(phs[j].getAttribute('data-i18n-ph'));
    if (lastState) renderState(lastState);
  }
  $('btnLang').addEventListener('click', function(){ applyLang(lang === 'zh' ? 'en' : 'zh'); });

  // 语言初始化（需在首次输出日志前执行）
  var initLang = 'zh';
  try {
    var saved = localStorage.getItem('dshLang');
    if (saved === 'en' || saved === 'zh') initLang = saved;
    else if ((navigator.language || 'en').toLowerCase().indexOf('zh') >= 0) initLang = 'zh';
    else initLang = 'en';
  } catch(e){}
  applyLang(initLang);

  // ── 工具函数 ────────────────────────────────────────────────
  var log = function(line, cls){
    var el = $('log');
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = line;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
  };
  log(t('logConnecting'));

  // ── registry 配置 ─────────────────────────────────────────
  var lastSaved = null;
  function renderRegistry(r){
    if (!r) return;
    var input = $('regInput');
    input.placeholder = r.default || '';
    input.value = r.saved || '';
    $('regHint').innerHTML =
      t('regHintDefault') + '<code>' + (r.default||'') + '</code>' +
      (r.saved ? t('regHintLast') + '<code>' + r.saved + '</code>' : '') +
      t('regHintEff') + '<code>' + (r.effective||'') + '</code>' +
      ' ｜ ' + t('regHintPriority') + ' ' + t('regHintNote');
    lastSaved = r.saved;
  }
  $('btnRegUseDef').addEventListener('click', function(){
    var r = lastSaved; // fallback to latest known registryInfo
    if (r && r.default) $('regInput').value = r.default;
  });
  $('btnRegSave').addEventListener('click', async function(){
    var v = $('regInput').value.trim();
    try {
      var res = await fetch('/__admin/api/registry', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ registry: v })
      });
      var j = await res.json();
      if (!res.ok || !j.ok) { log(t('errSave', { e: (j.error||res.status) }), 'err'); return; }
      renderRegistry(j.registry);
      log(t('regSaved', { v: v || t('useDefaultLabel') }));
    } catch(e){ log(t('errSave', { e: e.message }), 'err'); }
  });

  // ── 版本列表 ──────────────────────────────────────────────
  var ALL_VERSIONS = [];
  function renderVersions(v){
    var sel = $('verSelect');
    sel.innerHTML = '';
    if (v.error) log(t('warnVersions', { e: v.error }), 'err');
    var tags = v.distTags || {};
    var list = v.list || [];
    // 标签优先展示
    var seen = {};
    Object.keys(tags).forEach(function(k){
      if (seen[tags[k]]) return; seen[tags[k]] = 1;
      var o = document.createElement('option');
      o.value = tags[k]; o.textContent = k + (lang === 'zh' ? '（' + tags[k] + '）' : ' (' + tags[k] + ')');
      sel.appendChild(o);
    });
    if (list.length) {
      var og = document.createElement('optgroup');
      og.label = t('allVersions');
      list.slice().reverse().forEach(function(x){
        if (seen[x]) return; seen[x] = 1;
        var o = document.createElement('option');
        o.value = x; o.textContent = x;
        og.appendChild(o);
      });
      sel.appendChild(og);
    }
    if (!sel.options.length) {
      var o = document.createElement('option');
      o.value = ''; o.textContent = t('noVersions');
      sel.appendChild(o);
    }
    // 默认选中当前安装版本
    var cur = ALL_VERSIONS.__cur;
    if (cur) { sel.value = cur; }
  }
  $('btnRefreshVer').addEventListener('click', function(){
    log(t('logRefreshStart'));
    fetch('/__admin/api/versions?refresh=1').then(r=>r.json()).then(function(j){
      renderVersions(j); log(t('logRefreshDone', { n: (j.list||[]).length }));
    }).catch(function(e){ log(t('errTag') + ' ' + e.message, 'err'); });
  });
  $('btnInstall').addEventListener('click', async function(){
    var v = $('verSelect').value;
    if (!v) { log(t('warnSelectFirst'), 'err'); return; }
    $('btnInstall').disabled = true;
    try {
      var res = await fetch('/__admin/api/install', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ version: v })
      });
      var j = await res.json();
      if (res.status === 409) { log(t('errTag') + ' ' + j.error, 'err'); return; }
      log(t('logInstallSubmit', { v: v }));
    } catch(e){ log(t('errTag') + ' ' + e.message, 'err'); }
    finally { $('btnInstall').disabled = false; }
  });

  // ── 状态刷新 ──────────────────────────────────────────────
  function renderState(s){
    if (!s) return;
    lastState = s;
    var running = !!s.running;
    var badge = $('stBadge');
    var bk = (s.install && s.install.running) ? 'badgeInstalling' : (running ? 'badgeRunning' : (s.installed ? 'badgeNotRun' : 'badgeNotInstalled'));
    var bcl = (s.install && s.install.running) ? 'act' : (running ? 'ok' : (s.installed ? 'warn' : 'err'));
    badge.textContent = t(bk); badge.className = 'badge ' + bcl;

    $('stActual').textContent = s.actual || '-';
    var req = $('stRequested');
    if (s.requested && s.requested !== s.actual) req.textContent = t('stSelectedPrefix') + s.requested;
    else req.textContent = '';
    $('stInstalledAt').textContent = s.installedAt ? new Date(s.installedAt).toLocaleString() : '-';
    $('stRunning').textContent = running ? t('runYes') : t('runNo');
    $('linkDash').style.display = running ? '' : 'none';

    renderRegistry(s.registry);
    if (!ALL_VERSIONS.__cur && s.actual) ALL_VERSIONS.__cur = s.actual;
    if ((s.versions && s.versions.list) || (s.versions && s.versions.distTags)) {
      renderVersions(s.versions);
    }
  }
  function refresh(){
    fetch('/__admin/api/state').then(function(r){ return r.json(); }).then(renderState)
      .catch(function(e){ log(t('errRefresh', { e: e.message }), 'err'); });
  }
  $('btnRefresh').addEventListener('click', refresh);
  $('btnRestart').addEventListener('click', async function(){
    $('btnRestart').disabled = true;
    try {
      var j = await (await fetch('/__admin/api/restart', {method:'POST'})).json();
      log(j.ok ? t('restartDone') : t('errTag') + ' ' + t('restartFail', { r: (j.reason||'') }), j.ok?'':'err');
    } catch(e){ log(t('errTag') + ' ' + e.message, 'err'); }
    finally { $('btnRestart').disabled = false; }
  });
  $('btnClearLog').addEventListener('click', function(){ $('log').innerHTML=''; });

  // ── SSE 实时日志 ──────────────────────────────────────────
  if (window.EventSource) {
    var es = new EventSource('/__admin/api/events');
    es.addEventListener('start', function(ev){ var d=JSON.parse(ev.data); log(t('sseStart', { v: d.version })); });
    es.addEventListener('log', function(ev){ var d=JSON.parse(ev.data); log(d.line, /错误|ERR/i.test(d.line)?'err':''); });
    es.addEventListener('done', function(ev){
      var d=JSON.parse(ev.data);
      log(d.ok ? t('sseDone', { v: d.version }) : t('errTag') + ' ' + t('sseDoneFail'), d.ok?'':'err');
      refresh();
    });
    es.addEventListener('boot', function(ev){
      var d=JSON.parse(ev.data);
      log(d.ok ? t('sseBootOk') : t('errTag') + ' ' + t('sseBootFail', { r: d.reason }), d.ok?'':'err');
      refresh();
    });
    es.onerror = function(){ /* 连接断开自动重连 */ };
  }

  // 初始加载
  refresh();
})();
</script>
</body>
</html>
